name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check (strict)
        run: uv run mypy
      - name: Import layers
        run: uv run lint-imports
      - name: Tests (offline)
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=85
      - name: Offline eval gate
        run: uv run python -m evals.run_evals --provider fake --min-accuracy 0.8

  live-eval:
    # Real Claude evals run only on main and only when the secret is configured.
    if: github.ref == 'refs/heads/main'
    needs: python
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Claude eval gate
        if: env.ANTHROPIC_API_KEY != ''
        run: uv run python -m evals.run_evals --provider anthropic --min-accuracy 0.9

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
