[project]
name = "eu261-claim-agent"
version = "0.1.0"
description = "AI agent that triages EU261 flight-compensation claims: extracts facts, gathers evidence with tools, applies deterministic rules, drafts the claim letter and hands it to a human for approval."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.163.1",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
claim-agent = "eu261_claim_agent.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "S", "PT", "C4", "RET", "ARG"]
ignore = [
    "S101",  # assert is used for invariants and in tests
    "N818",  # LLMRefusal / LLMUnavailable read better than *Error here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PT018", "C408"]
"src/eu261_claim_agent/llm/fake.py" = ["ARG002"]  # must match the LLMClient signature
"evals/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "evals"]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls the real Claude API (needs ANTHROPIC_API_KEY; skipped otherwise)",
]

[tool.coverage.run]
source = ["eu261_claim_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
